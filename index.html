<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style>
@charset "utf-8";

:root { --navy: #061a45; --navy-2: #0a2f7d; --royal: #0f55d0; --royal-2: #0a3a9c; --cyan: #f0b429; --cyan-soft: #ffe0a3; --paper: #edf2f9; --card: #ffffff; --ink: #0e1c3a; --muted: #5a6b86; --line: #cdd9ea; --led: #28d17c; --alert: #ff7a7a; --font: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif; color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { text-size-adjust: 100%; }

body { margin: 0px; background: var(--navy); color: var(--ink); font-family: var(--font); line-height: 1.7; font-size: 16px; min-height: 100dvh; }

body.in-app { overflow: hidden; }

button { font-family: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0px, 0px, 0px, 0px); white-space: nowrap; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentcolor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

.hub { min-height: 100dvh; display: flex; flex-direction: column; }

.hero { position: relative; color: rgb(255, 255, 255); overflow: hidden; padding: calc(env(safe-area-inset-top) + 14px) 0 0; background: radial-gradient(70% 34% at 50% 62%, rgba(59,201,255,.32), transparent 72%),
      radial-gradient(rgba(255,255,255,.11) 1px, transparent 1.4px) 0 0 / 22px 22px,
      linear-gradient(180deg, var(--royal) 0%, var(--royal-2) 52%, #0a2c78 80%, var(--navy) 100%); }

.topline { display: flex; align-items: center; gap: 12px; max-width: 596px; margin: 0px auto; padding: 0px 18px; }

.badge { width: 46px; height: 46px; border-radius: 50%; background: rgb(255, 255, 255); flex: 0 0 auto; display: grid; place-items: center; overflow: hidden; box-shadow: rgba(0, 0, 0, 0.25) 0px 4px 14px; }

.badge img { width: 88%; height: 88%; object-fit: contain; display: block; }

.org b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.45; }

.org span { display: block; font-size: 12.5px; color: rgba(255, 255, 255, 0.74); line-height: 1.5; }

.hub-lock { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.22); color: rgb(255, 255, 255); border-radius: 12px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

.hub-lock[hidden] { display: none; }

.hub-lock .ic { width: 17px; height: 17px; }

.hero-copy { max-width: 596px; margin: 26px auto 0px; padding: 0px 18px; text-align: center; }

.hero h1 { margin: 0px; font-size: clamp(26px, 7.6vw, 34px); font-weight: 800; line-height: 1.35; }

.hero .lede { margin: 6px 0px 0px; font-size: 14px; color: rgba(255, 255, 255, 0.82); text-wrap: balance; }

.art { display: block; width: 100%; max-width: 520px; height: auto; margin: 8px auto 0px; overflow: visible; }

.art .link { fill: none; stroke: rgba(155, 232, 255, 0.38); stroke-width: 1.2; }

.art .ring { fill: none; stroke: rgba(155, 232, 255, 0.16); stroke-width: 1; }

.art .node { fill: rgb(10, 47, 125); stroke: rgba(155, 232, 255, 0.62); stroke-width: 1.4; }

.art .ic { stroke: rgb(217, 245, 255); stroke-width: 1.6; }

.art .tower { stroke: rgb(255, 255, 255); stroke-width: 0.3; }

.art .ridge-back { fill: rgb(13, 75, 181); opacity: 0.5; }

.art .ridge-front { fill: rgb(6, 26, 69); }

.art .pkt { fill: rgb(155, 232, 255); }

@media (min-width: 700px) {
  .art { max-width: min(520px, 52vh); }
}

@media (min-width: 520px) {
  .art { mask-image: linear-gradient(90deg, transparent, rgb(0, 0, 0) 10%, rgb(0, 0, 0) 90%, transparent); }
}

.sheet { flex: 1 1 0%; position: relative; margin-top: -22px; background: var(--paper); border-radius: 28px 28px 0px 0px; padding: 24px 18px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }

.sheet-in { max-width: 560px; width: 100%; margin: 0px auto; flex: 1 1 0%; display: flex; flex-direction: column; }

.sheet h2 { margin: 0px 4px 12px; font-size: 15px; font-weight: 700; color: var(--ink); }

.door { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: start; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 13px 14px; box-shadow: rgba(10, 40, 110, 0.45) 0px 10px 24px -16px; transition: border-color 0.15s, box-shadow 0.15s; }

.door + .door { margin-top: 12px; }

.door:hover { border-color: var(--royal); box-shadow: rgba(15, 85, 208, 0.55) 0px 12px 26px -16px; }

.door:active { background: rgb(247, 250, 255); }

.tile { width: 64px; height: 64px; flex: 0 0 auto; display: block; overflow: hidden; background: rgb(255, 255, 255); }

.tile img { width: 100%; height: 100%; display: block; object-fit: contain; }

.tile-chat { border-radius: 16px; }

.tile-phone { border-radius: 50%; border: 1px solid var(--line); padding: 6px; }

.door-text { min-width: 0px; }

.door-text strong { display: block; font-size: 17px; font-weight: 800; line-height: 1.5; }

.door-text span { display: block; font-size: 13px; color: var(--muted); line-height: 1.7; text-wrap: balance; }

.state { display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--muted); }

.state .ic { width: 20px; height: 20px; }

.state .s-go { display: none; color: var(--royal); }

.led { width: 8px; height: 8px; border-radius: 50%; background: rgb(194, 204, 220); display: block; }

.door[data-open="true"] .s-lock { display: none; }

.door[data-open="true"] .s-go { display: block; }

.door[data-open="true"] .led { background: var(--led); box-shadow: rgba(40, 209, 124, 0.22) 0px 0px 0px 3px, rgba(40, 209, 124, 0.8) 0px 0px 10px; }

.note { margin: 14px 4px 0px; font-size: 12.5px; color: var(--muted); line-height: 1.9; text-wrap: balance; }

.foot { margin-top: auto; padding-top: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

.foot .ic { width: 16px; height: 16px; color: var(--royal); }

.pin-overlay { position: fixed; inset: 0px; z-index: 80; display: flex; align-items: flex-end; justify-content: center; background: rgba(3, 10, 32, 0.62); opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; }

.pin-overlay.on { opacity: 1; visibility: visible; transition: opacity 0.2s; }

.pin-sheet { width: 100%; max-width: 420px; color: rgb(255, 255, 255); outline: none; background: linear-gradient(rgb(13, 70, 179) 0%, rgb(8, 40, 108) 55%, rgb(6, 26, 69) 100%); border-radius: 26px 26px 0px 0px; padding: 10px 22px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); text-align: center; }

.pin-overlay.on .pin-sheet { transform: none; }

@media (min-width: 600px) {
  .pin-overlay { align-items: center; }
  .pin-sheet { border-radius: 26px; padding-bottom: 24px; transform: translateY(24px); }
}

.grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.28); margin: 4px auto 14px; }

.pin-sheet h2 { margin: 0px; font-size: 19px; font-weight: 800; }

.pin-target { margin: 2px 0px 16px; font-size: 13.5px; color: rgba(255, 255, 255, 0.75); }

.bars { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 42px; direction: ltr; }

.bar { width: 11px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); transition: background 0.12s, box-shadow 0.12s; }

.bar.on { background: var(--cyan); box-shadow: rgba(59, 201, 255, 0.7) 0px 0px 10px; }

.pin-sheet.ok .bar.on { background: var(--led); box-shadow: rgba(40, 209, 124, 0.75) 0px 0px 10px; }

.pin-sheet.bad .bar.on { background: var(--alert); box-shadow: rgba(255, 122, 122, 0.7) 0px 0px 10px; }

.pin-sheet.bad .bars { animation: 0.34s ease 0s 1 normal none running shake; }

@keyframes shake { 
  20% { transform: translateX(-7px); }
  45% { transform: translateX(7px); }
  70% { transform: translateX(-4px); }
  100% { transform: none; }
}

.pin-status { margin: 12px 0px 14px; min-height: 26px; font-size: 13.5px; color: rgba(255, 255, 255, 0.8); }

.pin-sheet.bad .pin-status { color: rgb(255, 179, 179); }

.pin-sheet.ok .pin-status { color: rgb(143, 240, 189); }

.keys { display: grid; grid-template-columns: repeat(3, 72px); justify-content: center; gap: 12px 18px; direction: ltr; }

.key { width: 72px; height: 72px; border-radius: 50%; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; background: rgba(255, 255, 255, 0.1); color: rgb(255, 255, 255); font-size: 27px; font-weight: 600; display: grid; place-items: center; touch-action: manipulation; user-select: none; transition: background 0.1s, transform 0.1s; }

.key:active { background: rgba(255, 255, 255, 0.24); transform: scale(0.95); }

.key.ghost { background: transparent; font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.78); }

.key.ghost:active { background: rgba(255, 255, 255, 0.1); }

.key .ic { width: 26px; height: 26px; }

.pin-sheet { max-height: 100dvh; overflow-y: auto; }

@media (max-height: 720px) {
  .grab { margin-bottom: 8px; }
  .pin-target { margin-bottom: 8px; }
  .pin-status { margin: 8px 0px 10px; }
  .keys { gap: 8px 16px; grid-template-columns: repeat(3, 62px); }
  .key { width: 62px; height: 62px; font-size: 24px; }
}

.appview { position: fixed; left: 0px; right: 0px; top: 0px; height: 100dvh; z-index: 60; display: none; flex-direction: column; background: var(--navy); }

body.in-app .appview { display: flex; }

.appbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; color: rgb(255, 255, 255); padding: calc(env(safe-area-inset-top) + 6px) 10px 6px; background: linear-gradient(180deg, var(--royal-2), var(--navy)); border-bottom: 1px solid rgba(255, 255, 255, 0.14); }

.bar-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0px 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }

.bar-btn .ic { width: 18px; height: 18px; }

.bar-btn.icon-only { width: 40px; padding: 0px; justify-content: center; }

.switch { flex: 1 1 0%; display: flex; justify-content: center; gap: 4px; min-width: 0px; }

.tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0px 12px; background: transparent; border: 1px solid transparent; border-radius: 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: rgba(255, 255, 255, 0.68); white-space: nowrap; }

.tab .ic { width: 18px; height: 18px; }

.tab[aria-selected="true"] { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.28); color: rgb(255, 255, 255); }

.frames { position: relative; flex: 1 1 0%; min-height: 0px; background: var(--navy); }

.frame { position: absolute; left: 0px; right: 0px; top: 0px; bottom: env(safe-area-inset-bottom); width: 100%; height: calc(100% - env(safe-area-inset-bottom)); border: 0px; background: rgb(255, 255, 255); display: none; }

.frame.on { display: block; }

@media (max-width: 380px) {
  .tab span { font-size: 12.5px; }
  .tab { padding: 0px 9px; }
  .bar-btn { padding: 0px 8px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: auto ease 0s 1 normal none running none !important; }
}

/* ---- Electrical-unit panels (chat link / phone directory) ---- */
.panel { height:100%; overflow-y:auto; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); color: var(--ink); background: var(--paper); }
.panel-in { max-width: 560px; margin: 0 auto; }
.panel-card { background: var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; text-align:center; box-shadow: var(--shadow, 0 10px 24px -16px rgba(10,40,110,.45)); }
.panel-card .ic-big { width:40px; height:40px; color: var(--royal); margin-bottom:10px; }
.panel-card h3 { margin:0 0 6px; font-size:16px; font-weight:800; }
.panel-card p { margin:0 0 16px; font-size:13px; color: var(--muted); line-height:1.8; }
.open-chat-btn { display:inline-flex; align-items:center; gap:8px; background: var(--royal); color:#fff; border:none; border-radius:14px; padding:12px 22px; font-size:14px; font-weight:700; cursor:pointer; }
.open-chat-btn:active { background: var(--royal-2); }
.panel-note { margin-top:14px; font-size:11.5px; color: var(--muted); line-height:1.8; }

.dir-search { width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 14px; font-size:13.5px; margin-bottom:12px; }
.dir-form { display:flex; flex-wrap:wrap; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:14px; }
.dir-form input { flex:1 1 110px; min-width:0; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; font-size:13px; }
.dir-form button { flex:0 0 auto; background: var(--royal); color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
.dir-list { display:flex; flex-direction:column; gap:8px; }
.dir-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
.dir-row .dir-main { flex:1; min-width:0; }
.dir-row .dir-name { font-size:13.5px; font-weight:700; }
.dir-row .dir-role { font-size:11.5px; color:var(--muted); }
.dir-row .dir-phone { font-size:13px; font-weight:700; direction:ltr; color:var(--royal); }
.dir-row .dir-del { background:transparent; border:none; color:var(--alert); font-size:12px; cursor:pointer; padding:4px 6px; }
.dir-empty { text-align:center; color:var(--muted); font-size:12.5px; padding:20px 0; }
</style>

<!-- ============ HUB ============ -->
<div class="hub" id="hub">

(function(){

var bars = Array.prototype.slice.call(document.querySelectorAll('#bars .bar'));
var keys = document.getElementById('keys');

var barLock = document.getElementById('bar-lock');

var doors = Array.prototype.slice.call(document.querySelectorAll('.door'));

var digits = "";
var pendingApp = null;
var activeApp = null;
var dirUnsub = null;

function showBanner(msg){
  pinStatus.textContent = msg || "";
}

function updateBars(){
  bars.forEach(function(b, i){ b.classList.toggle('on', i < digits.length); });
}

function resetPinSheet(){
  digits = "";
  updateBars();
  pinSheet.classList.remove('ok', 'bad');
  showBanner("یک رمز عددی " + PIN_LEN + " رقمی وارد کنید");
}

function openPin(appName){
  pendingApp = appName;
  pinTarget.textContent = appName === 'chat' ? 'برای ورود به چت همکاران' : 'برای ورود به دفترچه تلفن';
  resetPinSheet();
  pinOverlay.classList.add('on');
  pinSheet.focus();
}

function closePin(){
  pinOverlay.classList.remove('on');
  pendingApp = null;
}

var PASSCODE_KEY = 'gate_passcode';

async function checkOrSetPasscode(code){
  try{
    var saved = localStorage.getItem(PASSCODE_KEY);
    if(saved !== null){
      if(saved === code){ return {ok:true}; }
      return {ok:false, reason:'رمز اشتباه است'};
    } else {
      localStorage.setItem(PASSCODE_KEY, code);
      return {ok:true, created:true};
    }
  } catch(e){
    return {ok:false, reason:'مرورگر اجازه ذخیره‌سازی نمی‌دهد (حالت ناشناس؟)'};
  }
}

async function submitPin(){
  showBanner("در حال بررسی…");
  var res = await checkOrSetPasscode(digits);
  if(res.ok){
    pinSheet.classList.add('ok');
    showBanner(res.created ? "رمز جدید ثبت شد" : "باز شد");
    try { sessionStorage.setItem('hub_unlocked', '1'); } catch(e){}
    setTimeout(function(){
      closePin();
      setDoorsOpen(true);
      if(pendingApp){ launchApp(pendingApp); }
    }, 450);
  } else {
    pinSheet.classList.add('bad');
    showBanner(res.reason || "رمز اشتباه است");
    setTimeout(function(){
      pinSheet.classList.remove('bad');
      digits = "";
      updateBars();
    }, 420);
  }
}

keys.addEventListener('click', function(e){
  var btn = e.target.closest('.key');
  if(!btn) return;
  var k = btn.dataset.k;
  if(k === 'cancel'){ closePin(); return; }
  if(k === 'back'){ digits = digits.slice(0, -1); updateBars(); return; }
  if(digits.length < PIN_LEN){
    digits += k;
    updateBars();
    if(digits.length === PIN_LEN){ submitPin(); }
  }
});

function setDoorsOpen(open){
  doors.forEach(function(d){ d.dataset.open = open ? 'true' : 'false'; });
  var statusEls = document.querySelectorAll('.door-status');
  statusEls.forEach(function(s){ s.textContent = open ? 'باز است' : 'قفل است'; });
}

doors.forEach(function(d){
  d.addEventListener('click', function(){
    var app = d.dataset.app;
    if(d.dataset.open === 'true'){ launchApp(app); }
    else { openPin(app); }
  });
});

tabs.forEach(function(t){
  t.addEventListener('click', function(){ switchApp(t.dataset.app); });
});

barBack.addEventListener('click', function(){
  document.body.classList.remove('in-app');
});

barLock.addEventListener('click', function(){
  try { sessionStorage.removeItem('hub_unlocked'); } catch(e){}
  setDoorsOpen(false);
  document.body.classList.remove('in-app');
  activeApp = null;
});

function launchApp(app){
  document.body.classList.add('in-app');
  switchApp(app);
}

function switchApp(app){
  activeApp = app;
  tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.app === app ? 'true' : 'false'); });
  if(app === 'chat'){ renderChatPanel(); }
  else { renderPhonePanel(); }
}

function renderChatPanel(){
  frames.innerHTML =
    '<div class="panel"><div class="panel-in">' +
      '<div class="panel-card">' +
        '<svg class="ic ic-big"><use href="#i-chat"></use></svg>' +

        '<button class="open-chat-btn" id="open-chat-btn" type="button">' +
          '<svg class="ic" style="width:18px;height:18px"><use href="#i-chevron-l"></use></svg>' +
          'باز کردن چت' +
        '</button>' +
      '</div>' +
      '<p class="panel-note">چت در تب جدید مرورگر باز می‌شود؛ در صورت بسته شدن، از همین دکمه دوباره وارد شوید.</p>' +
    '</div></div>';
  document.getElementById('open-chat-btn').addEventListener('click', function(){
    window.open(CHAT_URL, '_blank');
  });
}

function renderPhonePanel(){
  frames.innerHTML =
    '<div class="panel"><div class="panel-in">' +
      '<input type="text" class="dir-search" id="dir-search" placeholder="جستجو بر اساس نام، سمت یا شماره…">' +
      '<div class="dir-form">' +
        '<input type="text" id="dir-name" placeholder="نام">' +
        '<input type="text" id="dir-role" placeholder="سمت / واحد">' +
        '<input type="tel" id="dir-phone" placeholder="شماره تماس" style="direction:ltr">' +
        '<button type="button" id="dir-add">افزودن</button>' +
      '</div>' +
      '<div class="dir-list" id="dir-list"><p class="dir-empty">در حال بارگذاری…</p></div>' +
    '</div></div>';

  var allContacts = [];

  function paint(){
    var q = (document.getElementById('dir-search').value || '').trim();
    var list = document.getElementById('dir-list');
    var rows = allContacts.filter(function(c){
      if(!q) return true;
      var hay = (c.name||'') + ' ' + (c.role||'') + ' ' + (c.phone||'');
      return hay.indexOf(q) !== -1;
    });
    if(rows.length === 0){
      list.innerHTML = '<p class="dir-empty">موردی پیدا نشد</p>';
      return;
    }
    list.innerHTML = rows.map(function(c){
      return '<div class="dir-row" data-id="' + c.id + '">' +
        '<div class="dir-main"><div class="dir-name"></div><div class="dir-role"></div></div>' +
        '<div class="dir-phone"></div>' +
        '<button class="dir-del" type="button">حذف</button>' +
      '</div>';
    }).join('');
    Array.prototype.slice.call(list.children).forEach(function(row, i){
      var c = rows[i];
      row.querySelector('.dir-name').textContent = c.name || '';
      row.querySelector('.dir-role').textContent = c.role || '';
      row.querySelector('.dir-phone').textContent = c.phone || '';
      row.querySelector('.dir-del').addEventListener('click', function(){ deleteContact(c.id); });
    });
  }

  var CONTACTS_KEY = 'directory_contacts';

  function loadContacts(){
    try{
      var raw = localStorage.getItem(CONTACTS_KEY);
      var list = raw ? JSON.parse(raw) : DIR_SEED.map(function(x){ return Object.assign({}, x); });
      list.sort(function(a, b){ return (a.name||'').localeCompare(b.name||'', 'fa'); });
      return list;
    } catch(e){ return []; }
  }

  function saveContacts(list){
    try{ localStorage.setItem(CONTACTS_KEY, JSON.stringify(list)); } catch(e){}
  }

  function refreshAndPaint(){
    allContacts = loadContacts();
    paint();
  }

  document.getElementById('dir-search').addEventListener('input', paint);

  document.getElementById('dir-add').addEventListener('click', function(){
    var name = document.getElementById('dir-name').value.trim();
    var role = document.getElementById('dir-role').value.trim();
    var phone = document.getElementById('dir-phone').value.trim();
    if(!name || !phone){ return; }
    var list = loadContacts();
    list.push({ id: String(Date.now()) + Math.random().toString(16).slice(2), name: name, role: role, phone: phone, addedAt: Date.now() });
    saveContacts(list);
    document.getElementById('dir-name').value = '';
    document.getElementById('dir-role').value = '';
    document.getElementById('dir-phone').value = '';
    refreshAndPaint();
  });

  function deleteContact(id){
    var list = loadContacts().filter(function(c){ return c.id !== id; });
    saveContacts(list);
    refreshAndPaint();
  }

  refreshAndPaint();
}

/* ---- init ---- */
try {
  if(sessionStorage.getItem('hub_unlocked') === '1'){ setDoorsOpen(true); }
} catch(e){}

/* ---- PWA install + service worker (only meaningful when self-hosted) ---- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
var deferredInstallPrompt = null;
var installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(installBtn){ installBtn.hidden = false; }
});
if (installBtn) {
  installBtn.addEventListener('click', async function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.hidden = true;
  });
}

/* ---- Warn when not hosted inside claude.ai (db capability unavailable) ---- */
if (typeof window.claude === 'undefined') {
  var warnBar = document.createElement('div');
  warnBar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:#3a1a1a;color:#ffd9d9;font-size:12px;line-height:1.8;padding:10px 14px;text-align:center;';
  warnBar.textContent = 'این نسخه خارج از claude.ai اجرا شده؛ قفل رمز و دفترچه تلفن کار نمی‌کنند. برای عملکرد کامل از لینک درگاه در claude.ai استفاده کنید.';
  document.body.appendChild(warnBar);
}

})();
